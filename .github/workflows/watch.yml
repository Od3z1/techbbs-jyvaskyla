name: TechBBS Jyväskylä
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      test_push:
        description: Lähetä vain testiviesti
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: techbbs-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tarkista uudet ilmoitukset
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TEST_PUSH: ${{ inputs.test_push }}
        run: |
          if [ "$TEST_PUSH" = "true" ]; then
            python watch.py --test-push
          else
            python watch.py
          fi
      - name: Tallenna jo käsitellyt ilmoitukset myös osittaisen virheen jälkeen
        if: always()
        run: |
          if compgen -G 'state*.json' > /dev/null; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state*.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update watch state [skip ci]'
              git pull --rebase
              git push
            fi
          fi
